<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Checker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --surface-0: #f5f5f5;
      --surface-1: #f0f0f0;
      --surface-2: #ffffff;
      --border: #d0d0d0;
      --bg-success: #d1fae5;
      --bg-danger: #fee2e2;
      --fill-success: #10b981;
      --fill-danger: #dc2626;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f5f5f5;
        --text-secondary: #b0b0b0;
        --text-muted: #808080;
        --surface-0: #1a1a1a;
        --surface-1: #2a2a2a;
        --surface-2: #3a3a3a;
        --border: #4a4a4a;
        --bg-danger: #7f1d1d;
        --bg-success: #064e3b;
        --fill-danger: #ef4444;
        --fill-success: #34d399;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--surface-0);
      color: var(--text-primary);
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      background-color: var(--surface-1);
      margin-bottom: 2rem;
    }

    .upload-zone:hover {
      border-color: var(--text-secondary);
    }

    .upload-icon {
      font-size: 32px;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 0.5rem;
    }

    .upload-title {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 0.5rem;
      color: var(--text-primary);
    }

    .upload-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    #fileInput {
      display: none;
    }

    #result {
      display: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .preview-container {
      background: var(--surface-1);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .preview-controls {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: var(--surface-2);
      border-bottom: 0.5px solid var(--border);
      justify-content: center;
    }

    .zoom-button {
      padding: 6px 12px;
      background: var(--surface-1);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      color: var(--text-primary);
    }

    .zoom-button:hover {
      background: var(--surface-2);
    }

    .zoom-level {
      font-size: 12px;
      color: var(--text-secondary);
      min-width: 50px;
      text-align: center;
      padding: 6px;
    }

    #previewScroll {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: white;
    }

    #previewCanvas {
      display: block;
      max-width: none;
    }

    .right-column {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
      max-height: 600px;
    }

    .card {
      background-color: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin: 0 0 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metadata-item {
      font-size: 13px;
      margin-bottom: 0.75rem;
      padding: 0.5rem;
      background: var(--surface-1);
      border-radius: var(--radius);
    }

    .metadata-label {
      font-weight: 500;
      color: var(--text-secondary);
    }

    .metadata-value {
      color: var(--text-primary);
      word-break: break-all;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: var(--surface-1);
      border-radius: var(--radius);
    }

    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checklist-content {
      flex: 1;
    }

    .checklist-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      display: block;
      margin-bottom: 0.25rem;
    }

    .checklist-found {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .auto-detected {
      color: var(--text-muted);
      font-size: 11px;
      font-style: italic;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 2rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--text-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #error {
      display: none;
      background-color: var(--bg-danger);
      border: 0.5px solid #fca5a5;
      border-radius: var(--radius);
      padding: 1rem;
      color: #c41e3a;
      margin-top: 1rem;
    }

    @media (max-width: 900px) {
      #result {
        grid-template-columns: 1fr;
      }
      .preview-container {
        height: 400px;
      }
      .right-column {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Invoice Checker</h1>
      <p class="subtitle">Metadata auto-check + manual UK law verification</p>
    </div>

    <div class="upload-zone" id="dropZone">
      <i class="ti ti-upload upload-icon" aria-hidden="true"></i>
      <p class="upload-title">Drop invoice here or click to upload</p>
      <p class="upload-text">PDF files only</p>
      <input type="file" id="fileInput" accept=".pdf">
    </div>

    <div id="result">
      <div class="preview-container">
        <div class="preview-controls">
          <button class="zoom-button" id="zoomOut">−</button>
          <span class="zoom-level" id="zoomLevel">100%</span>
          <button class="zoom-button" id="zoomIn">+</button>
          <button class="zoom-button" id="resetZoom">Reset</button>
        </div>
        <div id="previewScroll">
          <canvas id="previewCanvas"></canvas>
        </div>
      </div>

      <div class="right-column">
        <div class="card">
          <p class="card-title">Metadata</p>
          <div id="metadataList"></div>
        </div>

        <div class="card">
          <p class="card-title">UK Invoice Requirements</p>
          <div id="checklistContainer"></div>
        </div>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p style="color: var(--text-secondary);">Analyzing invoice...</p>
    </div>

    <div id="error"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');
    const errorDiv = document.getElementById('error');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.opacity = '0.7';
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.style.opacity = '1';
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.opacity = '1';
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        analyzeFile();
      }
    });

    fileInput.addEventListener('change', analyzeFile);

    let currentZoom = 1;
    document.getElementById('zoomIn').addEventListener('click', () => {
      currentZoom += 0.2;
      updateZoom();
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
      if (currentZoom > 0.4) currentZoom -= 0.2;
      updateZoom();
    });
    document.getElementById('resetZoom').addEventListener('click', () => {
      currentZoom = 1;
      updateZoom();
    });

    function updateZoom() {
      const canvas = document.getElementById('previewCanvas');
      canvas.style.transform = `scale(${currentZoom})`;
      canvas.style.transformOrigin = 'top center';
      document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
    }

    async function analyzeFile() {
      const file = fileInput.files[0];
      if (!file) return;

      resultDiv.style.display = 'none';
      errorDiv.style.display = 'none';
      loadingDiv.style.display = 'block';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        const metadata = await pdf.getMetadata();
        const info = metadata.info || {};

        const firstPage = await pdf.getPage(1);
        const canvas = document.getElementById('previewCanvas');
        const context = canvas.getContext('2d');
        const viewport = firstPage.getViewport({scale: 1.5});
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await firstPage.render({canvasContext: context, viewport: viewport}).promise;

        let fullText = '';
        for (let i = 0; i < pdf.numPages; i++) {
          const page = await pdf.getPage(i + 1);
          const textContent = await page.getTextContent();
          fullText += textContent.items.map(item => item.str).join(' ') + '\n';
        }

        displayMetadata(info);
        displayChecklist(fullText);
      } catch (err) {
        errorDiv.textContent = 'Error: ' + err.message;
        errorDiv.style.display = 'block';
      }

      loadingDiv.style.display = 'none';
      resultDiv.style.display = 'grid';
    }

    function displayMetadata(info) {
      const list = document.getElementById('metadataList');
      list.innerHTML = '';

      const metadata = [
        {label: 'Creator', value: info.Creator || 'Not found'},
        {label: 'Producer', value: info.Producer || 'Not found'},
        {label: 'Author', value: info.Author || 'Not found'},
        {label: 'Title', value: info.Title || 'Not found'},
        {label: 'Keywords', value: info.Keywords || 'None'}
      ];

      metadata.forEach(item => {
        const div = document.createElement('div');
        div.className = 'metadata-item';
        div.innerHTML = `<span class="metadata-label">${item.label}:</span> <span class="metadata-value">${item.value}</span>`;
        list.appendChild(div);
      });
    }

    function displayChecklist(fullText) {
      const container = document.getElementById('checklistContainer');
      container.innerHTML = '';

      const checks = [
        {
          name: 'Invoice Number',
          regex: /invoice\s*(?:no|number|#)?\s*[:#]?\s*(\d{5,})|invoice\s*(\d{7,})/i,
          description: 'Unique invoice identifier'
        },
        {
          name: 'Invoice Date',
          regex: /\d{1,2}\s*[\/\-\.]\s*\d{1,2}\s*[\/\-\.]\s*\d{4}|(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s*,?\s*\d{4}/i,
          description: 'Date of invoice'
        },
        {
          name: 'VAT Number',
          regex: /GB\s*\d{9,12}|VAT\s*(?:Number|No)?\s*\d{9,12}/i,
          description: 'VAT registration (GB...)'
        },
        {
          name: 'Supplier Address',
          regex: /(?:from|supplier|company|address)[:\s]+[^\n]*(?:street|road|house|suite|floor|building|avenue|lane|drive)/i,
          description: 'Full supplier address'
        },
        {
          name: 'Customer Address',
          regex: /(?:bill to|customer|client|ship to)[:\s]+[^\n]*(?:street|road|house|suite|floor|building|avenue|lane|drive)/i,
          description: 'Full customer address'
        },
        {
          name: 'Line Items/Description',
          regex: /(?:description|item|service|product)[:\s]([^\n]{20,})/i,
          description: 'Detailed goods/services description'
        },
        {
          name: 'Total Amount',
          regex: /(?:total|amount due|grand total|total due)[:\s]*[£$€]?\s*[\d,]+\.?\d*/i,
          description: 'Invoice total'
        },
        {
          name: 'Company Reg Number',
          regex: /(?:company registration|companies house|reg|registration)[:\s]*(\d{8})/i,
          description: '8-digit company registration'
        }
      ];

      checks.forEach((check, index) => {
        const found = check.regex.test(fullText);
        const match = fullText.match(check.regex);
        const matchText = match ? match[0].substring(0, 60) : '';

        const div = document.createElement('div');
        div.className = 'checklist-item';
        div.innerHTML = `
          <input type="checkbox" id="check-${index}" ${found ? 'checked' : ''}>
          <div class="checklist-content">
            <label for="check-${index}" class="checklist-label">${check.name}</label>
            <span class="checklist-found">${check.description}</span>
            ${found ? `<span class="auto-detected">Found: "${matchText}..."</span>` : '<span class="auto-detected">Not auto-detected - check manually</span>'}
          </div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
