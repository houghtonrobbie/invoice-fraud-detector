<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Checker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --text-success: #047857;
      --surface-0: #f5f5f5;
      --surface-1: #f0f0f0;
      --surface-2: #ffffff;
      --border: #d0d0d0;
      --bg-success: #d1fae5;
      --bg-danger: #fee2e2;
      --fill-success: #10b981;
      --fill-danger: #dc2626;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f5f5f5;
        --text-secondary: #b0b0b0;
        --text-muted: #808080;
        --surface-0: #1a1a1a;
        --surface-1: #2a2a2a;
        --surface-2: #3a3a3a;
        --border: #4a4a4a;
        --bg-danger: #7f1d1d;
        --bg-success: #064e3b;
        --fill-danger: #ef4444;
        --fill-success: #34d399;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--surface-0);
      color: var(--text-primary);
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      background-color: var(--surface-1);
      margin-bottom: 2rem;
    }

    .upload-zone:hover {
      border-color: var(--text-secondary);
    }

    .upload-icon {
      font-size: 32px;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 0.5rem;
    }

    .upload-title {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 0.5rem;
      color: var(--text-primary);
    }

    .upload-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    #fileInput {
      display: none;
    }

    #result {
      display: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .preview-container {
      background: var(--surface-1);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .preview-label {
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px;
      text-align: center;
      background: var(--surface-2);
      border-bottom: 0.5px solid var(--border);
    }

    #previewScroll {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: white;
    }

    #previewCanvas {
      display: block;
      max-width: none;
    }

    .right-column {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
      max-height: 600px;
    }

    .card {
      background-color: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .verdict-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      flex-shrink: 0;
    }

    .verdict-text {
      flex: 1;
    }

    .verdict-title {
      font-size: 16px;
      font-weight: 500;
      margin: 0;
    }

    .verdict-reason {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0.5rem 0 0;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin: 0 0 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metadata-item {
      font-size: 13px;
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      background: var(--surface-1);
      border-radius: var(--radius);
      border-left: 3px solid var(--border);
    }

    .metadata-item.warning {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.05);
    }

    .metadata-label {
      font-weight: 500;
      color: var(--text-secondary);
    }

    .metadata-value {
      color: var(--text-primary);
      word-break: break-all;
      display: block;
      margin-top: 0.25rem;
      font-size: 12px;
    }

    .warning-icon {
      color: #f59e0b;
      font-weight: bold;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: var(--surface-1);
      border-radius: var(--radius);
    }

    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checklist-content {
      flex: 1;
    }

    .checklist-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      display: block;
      margin-bottom: 0.25rem;
    }

    .checklist-found {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .auto-detected {
      color: var(--text-muted);
      font-size: 11px;
      font-style: italic;
    }

    .duplicate-check {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 0.5px solid var(--border);
    }

    .duplicate-input {
      width: 100%;
      padding: 8px;
      font-size: 12px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
      color: var(--text-primary);
    }

    #loading {
      display: none;
      text-align: center;
      padding: 2rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--text-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #error {
      display: none;
      background-color: var(--bg-danger);
      border: 0.5px solid #fca5a5;
      border-radius: var(--radius);
      padding: 1rem;
      color: #c41e3a;
      margin-top: 1rem;
    }

    @media (max-width: 900px) {
      #result {
        grid-template-columns: 1fr;
      }
      .preview-container {
        height: 400px;
      }
      .right-column {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Invoice Checker</h1>
      <p class="subtitle">Advanced validation with metadata analysis</p>
    </div>

    <div class="upload-zone" id="dropZone">
      <i class="ti ti-upload upload-icon" aria-hidden="true"></i>
      <p class="upload-title">Drop invoice here or click to upload</p>
      <p class="upload-text">PDF files only (Ctrl+scroll to zoom)</p>
      <input type="file" id="fileInput" accept=".pdf">
    </div>

    <div id="result">
      <div class="preview-container">
        <div class="preview-label">Use Ctrl + scroll wheel to zoom</div>
        <div id="previewScroll">
          <canvas id="previewCanvas"></canvas>
        </div>
      </div>

      <div class="right-column">
        <div class="card verdict-card">
          <div id="badge" class="badge">
            <i class="ti ti-alert-circle" aria-hidden="true"></i>
          </div>
          <div class="verdict-text">
            <p id="verdict" class="verdict-title"></p>
            <p id="verdictReason" class="verdict-reason"></p>
          </div>
        </div>

        <div class="card">
          <p class="card-title">Metadata Analysis</p>
          <div id="metadataList"></div>
        </div>

        <div class="card">
          <p class="card-title">Advanced Checks</p>
          <div id="advancedChecksList"></div>
          <div class="duplicate-check">
            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 0.5rem;">Check for duplicate invoice numbers:</p>
            <input type="text" id="invoiceNumberHistory" class="duplicate-input" placeholder="Paste previous invoice numbers (comma separated)">
            <p id="duplicateWarning" style="font-size: 11px; color: #f59e0b; margin-top: 0.5rem; display: none;"></p>
          </div>
        </div>

        <div class="card">
          <p class="card-title">UK Invoice Requirements</p>
          <div id="checklistContainer"></div>
        </div>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p style="color: var(--text-secondary);">Analyzing invoice...</p>
    </div>

    <div id="error"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');
    const errorDiv = document.getElementById('error');
    const previewScroll = document.getElementById('previewScroll');
    const invoiceNumberHistoryInput = document.getElementById('invoiceNumberHistory');

    let currentInvoiceNumber = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.opacity = '0.7';
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.style.opacity = '1';
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.opacity = '1';
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        analyzeFile();
      }
    });

    fileInput.addEventListener('change', analyzeFile);

    invoiceNumberHistoryInput.addEventListener('input', () => {
      checkForDuplicates();
    });

    let currentZoom = 1;
    const canvas = document.getElementById('previewCanvas');

    previewScroll.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      
      currentZoom += (e.deltaY > 0 ? -0.1 : 0.1);
      currentZoom = Math.max(0.4, Math.min(currentZoom, 3));
      
      canvas.style.transform = `scale(${currentZoom})`;
      canvas.style.transformOrigin = 'top center';
    });

    async function analyzeFile() {
      const file = fileInput.files[0];
      if (!file) return;

      resultDiv.style.display = 'none';
      errorDiv.style.display = 'none';
      loadingDiv.style.display = 'block';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        const metadata = await pdf.getMetadata();
        const info = metadata.info || {};

        const firstPage = await pdf.getPage(1);
        const context = canvas.getContext('2d');
        const viewport = firstPage.getViewport({scale: 1.5});
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await firstPage.render({canvasContext: context, viewport: viewport}).promise;

        let fullText = '';
        for (let i = 0; i < pdf.numPages; i++) {
          const page = await pdf.getPage(i + 1);
          const textContent = await page.getTextContent();
          fullText += textContent.items.map(item => item.str).join(' ') + '\n';
        }

        displayMetadata(info);
        const advancedResults = displayAdvancedChecks(fullText);
        const checklist = displayChecklist(fullText);
        displayVerdict(info, checklist, advancedResults);
      } catch (err) {
        errorDiv.textContent = 'Error: ' + err.message;
        errorDiv.style.display = 'block';
      }

      loadingDiv.style.display = 'none';
      resultDiv.style.display = 'grid';
    }

    function displayMetadata(info) {
      const list = document.getElementById('metadataList');
      list.innerHTML = '';

      const suspiciousDesignTools = ['canva', 'adobe', 'indesign', 'google docs', 'figma'];
      const legitimateTools = ['sap', 'quickbooks', 'xero', 'sage', 'freshbooks', 'netsuite', 'workbench', 'aspose'];
      
      const checks = [
        {
          label: 'Creator',
          value: info.Creator || 'Not found',
          check: (val) => {
            const lower = val.toLowerCase();
            if (suspiciousDesignTools.some(t => lower.includes(t))) return {warning: true, text: 'Created in design tool (Canva, Adobe, etc.)'};
            if (legitimateTools.some(t => lower.includes(t))) return {warning: false, text: 'Professional accounting software'};
            if (!val || val === 'Not found') return {warning: true, text: 'No creator information'};
            return {warning: false, text: 'Standard software'};
          }
        },
        {
          label: 'Producer',
          value: info.Producer || 'Not found',
          check: (val) => {
            const lower = val.toLowerCase();
            if (suspiciousDesignTools.some(t => lower.includes(t))) return {warning: true, text: 'Design tool output'};
            return {warning: false};
          }
        },
        {
          label: 'Author',
          value: info.Author || 'Not found',
          check: (val) => {
            if (!val || val === 'Not found') return {warning: false};
            if (val.split(' ').length === 1 && val.length < 15) return {warning: false, text: 'Person name (expected)'};
            if (val.length > 50) return {warning: true, text: 'Unusually long author field'};
            return {warning: false};
          }
        },
        {
          label: 'Title',
          value: info.Title || 'Not found',
          check: (val) => {
            const lower = val.toLowerCase();
            const templates = ['template', 'sample', 'example', 'invoice template', 'minimal invoice', 'freelancer invoice'];
            if (templates.some(t => lower.includes(t))) return {warning: true, text: 'Generic template title'};
            if (!val || val === 'Not found') return {warning: true, text: 'No title set'};
            return {warning: false};
          }
        },
        {
          label: 'Keywords',
          value: info.Keywords || 'None',
          check: (val) => {
            if (!val || val === 'None') return {warning: false, text: 'No keywords'};
            if (/^[a-z0-9]{15,}$/.test(val)) return {warning: true, text: 'Random gibberish keywords'};
            return {warning: false};
          }
        },
        {
          label: 'Creation Date',
          value: info.CreationDate ? new Date(info.CreationDate).toLocaleDateString() : 'Unknown',
          check: (val) => {
            if (val === 'Unknown') return {warning: true, text: 'No creation date'};
            return {warning: false};
          }
        }
      ];

      checks.forEach(item => {
        const result = item.check(item.value);
        const isWarning = result.warning;
        
        const div = document.createElement('div');
        div.className = `metadata-item ${isWarning ? 'warning' : ''}`;
        
        let html = `<span class="metadata-label">${item.label}</span>`;
        if (isWarning) html += ' <span class="warning-icon">⚠</span>';
        html += `<span class="metadata-value">${item.value}</span>`;
        if (result.text) html += `<span class="auto-detected">${result.text}</span>`;
        
        div.innerHTML = html;
        list.appendChild(div);
      });
    }

    function displayAdvancedChecks(fullText) {
      const container = document.getElementById('advancedChecksList');
      container.innerHTML = '';

      const results = {};

      // VAT validation
      const vatMatch = fullText.match(/GB\s*(\d{3})\s*(\d{3})\s*(\d{3})|GB(\d{9})/i);
      const hasValidVAT = vatMatch ? true : false;
      results.vatValid = hasValidVAT;
      
      const vatDiv = document.createElement('div');
      vatDiv.className = 'metadata-item' + (hasValidVAT ? '' : ' warning');
      vatDiv.innerHTML = `<span class="metadata-label">VAT Format ${hasValidVAT ? '✓' : '✗'}</span><span class="auto-detected">${hasValidVAT ? 'Valid GB VAT format found' : 'VAT not in valid GB format'}</span>`;
      container.appendChild(vatDiv);

      // Date validation
      const dateMatches = fullText.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/g);
      let allDatesValid = true;
      if (dateMatches) {
        dateMatches.forEach(dateStr => {
          const parts = dateStr.split(/[\/\-\.]/);
          const day = parseInt(parts[0]);
          const month = parseInt(parts[1]);
          const year = parseInt(parts[2]);
          
          if (day > 31 || month > 12 || year > new Date().getFullYear() + 1) {
            allDatesValid = false;
          }
        });
      }
      results.datesValid = allDatesValid;

      const dateDiv = document.createElement('div');
      dateDiv.className = 'metadata-item' + (allDatesValid ? '' : ' warning');
      dateDiv.innerHTML = `<span class="metadata-label">Date Validity ${allDatesValid ? '✓' : '✗'}</span><span class="auto-detected">${allDatesValid ? 'All dates are valid' : 'Invalid or future dates found'}</span>`;
      container.appendChild(dateDiv);

      // Payment terms
      const paymentTermsRegex = /(?:net|payment terms|due in|payment due)[\s:]*(\d+)\s*(?:days?|day)|(?:net\s*\d+|payment\s*(?:terms?)?\s*\d+\s*days?)/i;
      const hasPaymentTerms = paymentTermsRegex.test(fullText);
      results.paymentTerms = hasPaymentTerms;

      const paymentDiv = document.createElement('div');
      paymentDiv.className = 'metadata-item' + (hasPaymentTerms ? '' : ' warning');
      const paymentMatch = fullText.match(paymentTermsRegex);
      paymentDiv.innerHTML = `<span class="metadata-label">Payment Terms ${hasPaymentTerms ? '✓' : '✗'}</span><span class="auto-detected">${hasPaymentTerms ? 'Payment terms found: ' + (paymentMatch ? paymentMatch[0].substring(0, 40) : '') : 'No payment terms specified'}</span>`;
      container.appendChild(paymentDiv);

      // UK Postcode
      const postcodeRegex = /[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}/i;
      const hasPostcode = postcodeRegex.test(fullText);
      results.postcode = hasPostcode;

      const postcodeDiv = document.createElement('div');
      postcodeDiv.className = 'metadata-item' + (hasPostcode ? '' : ' warning');
      postcodeDiv.innerHTML = `<span class="metadata-label">UK Postcode ${hasPostcode ? '✓' : '✗'}</span><span class="auto-detected">${hasPostcode ? 'Valid UK postcode found' : 'No UK postcode found'}</span>`;
      container.appendChild(postcodeDiv);

      return results;
    }

    function displayChecklist(fullText) {
      const container = document.getElementById('checklistContainer');
      container.innerHTML = '';

      const checks = [
        {
          name: 'Invoice Number',
          regex: /invoice\s*(?:no|number|#|:)?\s*(\d{5,})|inv\s*:?\s*(\d{5,})|invoice\s+(\d{7,})|^\s*(\d{5,})\s*$/m,
          description: 'Unique invoice identifier'
        },
        {
          name: 'Invoice Date',
          regex: /\d{1,2}\s*[\/\-\.]\s*\d{1,2}\s*[\/\-\.]\s*\d{4}|(?:january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\s+\d{1,2}\s*,?\s*\d{4}|date[:\s]*\d{1,2}[\/-]\d{1,2}[\/-]\d{4}|dated[:\s]*\d{1,2}\s(?:january|february|march|april|may|june|july|august|september|october|november|december)/i,
          description: 'Date of invoice'
        },
        {
          name: 'VAT Number',
          regex: /GB\s*\d{3}\s*\d{3}\s*\d{3}|GB\d{9}|VAT\s*(?:registration|number|no|id|#)?:?\s*GB\s*\d{3}\s*\d{3}\s*\d{3}|VAT\s*(?:registration|number|no|id|#)?:?\s*GB\d{9}|VAT\s+(?:number|no)?\s*:?\s*\d{9,12}/i,
          description: 'VAT registration (GB...)'
        },
        {
          name: 'Supplier Details',
          regex: /(?:from|supplier|company|invoice from|bill from)[:\s]*([A-Z][^\n]{15,}?(?:Ltd|Limited|Ltd\.|plc|Inc|LLC|GmbH|AG|SA|PLC|Ltd|Pte))/i,
          description: 'Supplier name and company'
        },
        {
          name: 'Supplier Address',
          regex: /(?:from|supplier|company address|registered address|our address)[:\s]*([^\n]*(?:street|road|house|suite|floor|building|avenue|lane|drive|place|close|park|court|way|crescent)[^\n]*)/i,
          description: 'Full supplier address'
        },
        {
          name: 'Customer Address',
          regex: /(?:bill to|customer|client|ship to|invoice to|customer address|sold to)[:\s]*([^\n]*(?:street|road|house|suite|floor|building|avenue|lane|drive|place|close|park|court|way|crescent)[^\n]*)/i,
          description: 'Full customer address'
        },
        {
          name: 'Line Items/Description',
          regex: /(?:description|item|service|product|line item)[:\s]*([^\n]{20,})|(?:qty|quantity|units?)[:\s]*\d+[^\n]*(?:price|amount|total)[^\n]*/i,
          description: 'Itemised goods/services'
        },
        {
          name: 'Total Amount',
          regex: /(?:total|amount due|grand total|total due|total invoice|net total|gross total|invoice total)[:\s]*£\s*[\d,]+\.?\d{0,2}|total[:\s]*\$\s*[\d,]+\.?\d{0,2}|total[:\s]*€\s*[\d,]+\.?\d{0,2}/i,
          description: 'Clear invoice total'
        },
        {
          name: 'Company Reg Number',
          regex: /(?:company registration|companies house|reg|registration|co reg|company no|company number)[:\s]*(\d{8})/i,
          description: '8-digit company registration'
        }
      ];

      let checkedCount = 0;
      checks.forEach((check, index) => {
        const found = check.regex.test(fullText);
        if (found) checkedCount++;
        
        const match = fullText.match(check.regex);
        const matchText = match ? match[0].substring(0, 55).trim() : '';

        if (check.name === 'Invoice Number' && match) {
          currentInvoiceNumber = match[1] || match[2] || match[3] || match[4];
        }

        const div = document.createElement('div');
        div.className = 'checklist-item';
        div.innerHTML = `
          <input type="checkbox" id="check-${index}" ${found ? 'checked' : ''}>
          <div class="checklist-content">
            <label for="check-${index}" class="checklist-label">${check.name}</label>
            <span class="checklist-found">${check.description}</span>
            ${found ? `<span class="auto-detected">Found: "${matchText}"</span>` : '<span class="auto-detected">Not auto-detected - check manually</span>'}
          </div>
        `;
        container.appendChild(div);
      });

      return {total: checks.length, checked: checkedCount};
    }

    function checkForDuplicates() {
      const historyText = invoiceNumberHistoryInput.value.trim();
      const warningDiv = document.getElementById('duplicateWarning');

      if (!currentInvoiceNumber || !historyText) {
        warningDiv.style.display = 'none';
        return;
      }

      const previousNumbers = historyText.split(',').map(n => n.trim());
      if (previousNumbers.includes(currentInvoiceNumber)) {
        warningDiv.style.display = 'block';
        warningDiv.textContent = '⚠️ DUPLICATE: This invoice number already exists in your history!';
      } else {
        warningDiv.style.display = 'none';
      }
    }

    function displayVerdict(info, checklist, advancedResults) {
      const badge = document.getElementById('badge');
      const verdict = document.getElementById('verdict');
      const reason = document.getElementById('verdictReason');

      let suspicionScore = 0;
      const suspiciousDesignTools = ['canva', 'adobe', 'indesign', 'google docs', 'figma'];
      const creator = (info.Creator || '').toLowerCase();
      
      if (suspiciousDesignTools.some(t => creator.includes(t))) suspicionScore += 40;
      if (/^[a-z0-9]{15,}$/.test(info.Keywords || '')) suspicionScore += 30;
      if ((info.Title || '').toLowerCase().includes('template')) suspicionScore += 25;
      if (!info.Creator || info.Creator === 'Not found') suspicionScore += 15;
      
      const completionRate = (checklist.checked / checklist.total) * 100;
      if (completionRate < 50) suspicionScore += 30;
      if (completionRate < 30) suspicionScore += 20;

      // Advanced checks
      if (!advancedResults.vatValid) suspicionScore += 15;
      if (!advancedResults.datesValid) suspicionScore += 25;
      if (!advancedResults.paymentTerms) suspicionScore += 10;
      if (!advancedResults.postcode) suspicionScore += 10;

      const isRedFlag = suspicionScore >= 60 || completionRate < 40;

      if (isRedFlag) {
        verdict.textContent = 'RED - Likely Fraud';
        verdict.style.color = '#c41e3a';
        badge.style.background = 'var(--fill-danger)';
        badge.innerHTML = '<i class="ti ti-alert-triangle" aria-hidden="true"></i>';
        reason.textContent = `Suspicion score: ${suspicionScore}/100 | Only ${checklist.checked}/${checklist.total} requirements`;
      } else {
        verdict.textContent = 'GREEN - Likely Legitimate';
        verdict.style.color = '#047857';
        badge.style.background = 'var(--fill-success)';
        badge.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>';
        reason.textContent = `Suspicion score: ${suspicionScore}/100 | ${checklist.checked}/${checklist.total} requirements`;
      }
    }
  </script>
