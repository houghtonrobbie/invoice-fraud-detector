<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Fraud Detector</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --text-danger: #c41e3a;
      --text-success: #047857;
      --surface-0: #f5f5f5;
      --surface-1: #f0f0f0;
      --surface-2: #ffffff;
      --border: #d0d0d0;
      --border-strong: #b0b0b0;
      --bg-danger: #fee2e2;
      --bg-success: #d1fae5;
      --fill-danger: #dc2626;
      --fill-success: #10b981;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f5f5f5;
        --text-secondary: #b0b0b0;
        --text-muted: #808080;
        --text-danger: #fca5a5;
        --text-success: #6ee7b7;
        --surface-0: #1a1a1a;
        --surface-1: #2a2a2a;
        --surface-2: #3a3a3a;
        --border: #4a4a4a;
        --border-strong: #5a5a5a;
        --bg-danger: #7f1d1d;
        --bg-success: #064e3b;
        --fill-danger: #ef4444;
        --fill-success: #34d399;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--surface-0);
      color: var(--text-primary);
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0;
    }

    .version {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      background-color: var(--surface-1);
      transition: all 0.2s;
    }

    .upload-zone:hover {
      border-color: var(--border-strong);
      background-color: var(--surface-2);
    }

    .upload-zone.dragover {
      border-color: var(--text-secondary);
      background-color: var(--surface-2);
    }

    .upload-icon {
      font-size: 32px;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      display: block;
    }

    .upload-title {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 0.5rem;
      color: var(--text-primary);
    }

    .upload-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    #fileInput {
      display: none;
    }

    #result {
      display: none;
      margin-top: 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    .preview-container {
      background: var(--surface-1);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    #previewCanvas {
      width: 100%;
      height: auto;
      display: block;
      background: white;
    }

    .checks-column {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .result-card {
      background-color: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      flex-shrink: 0;
    }

    .verdict {
      font-size: 18px;
      font-weight: 500;
      margin: 0;
      color: var(--text-primary);
    }

    .confidence {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0.25rem 0 0;
    }

    .check-card {
      background-color: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin: 0 0 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .checks-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0.75rem;
      border-radius: var(--radius);
      font-size: 14px;
    }

    .check-item.pass {
      background-color: var(--bg-success);
      color: var(--text-success);
    }

    .check-item.fail {
      background-color: var(--bg-danger);
      color: var(--text-danger);
    }

    .check-icon {
      font-weight: 500;
      min-width: 20px;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 2rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--text-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #error {
      display: none;
      background-color: var(--bg-danger);
      border: 0.5px solid #fca5a5;
      border-radius: var(--radius);
      padding: 1rem;
      color: var(--text-danger);
      margin-top: 1rem;
    }

    .footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 0.5px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 900px) {
      #result {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Invoice Fraud Detector</h1>
      <p class="subtitle">Upload a PDF to check metadata and compliance</p>
      <p class="version">v3.0</p>
    </div>

    <div class="upload-zone" id="dropZone">
      <i class="ti ti-upload upload-icon" aria-hidden="true"></i>
      <p class="upload-title">Drop invoice here or click to upload</p>
      <p class="upload-text">PDF files only</p>
      <input type="file" id="fileInput" accept=".pdf">
    </div>

    <div id="result">
      <div class="preview-container">
        <canvas id="previewCanvas"></canvas>
      </div>

      <div class="checks-column">
        <div class="result-card">
          <div class="result-header">
            <div id="badge" class="badge">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
            </div>
            <div>
              <p id="verdict" class="verdict"></p>
              <p id="confidence" class="confidence"></p>
            </div>
          </div>
        </div>

        <div class="check-card">
          <p class="card-label">Metadata analysis</p>
          <div id="metadataChecks" class="checks-list"></div>
        </div>

        <div class="check-card">
          <p class="card-label">UK invoice law compliance</p>
          <div id="lawChecks" class="checks-list"></div>
        </div>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p style="color: var(--text-secondary);">Analyzing invoice...</p>
    </div>

    <div id="error"></div>

    <div class="footer">
      <p>Metadata checking runs locally in your browser. No data is sent anywhere.</p>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');
    const errorDiv = document.getElementById('error');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        analyzeFile();
      }
    });

    fileInput.addEventListener('change', analyzeFile);

    async function analyzeFile() {
      const file = fileInput.files[0];
      if (!file) return;

      resultDiv.style.display = 'none';
      errorDiv.style.display = 'none';
      loadingDiv.style.display = 'block';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        const metadata = await pdf.getMetadata();
        const info = metadata.info || {};

        const firstPage = await pdf.getPage(1);
        const canvas = document.getElementById('previewCanvas');
        const context = canvas.getContext('2d');
        const viewport = firstPage.getViewport({scale: 1.5});
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await firstPage.render({canvasContext: context, viewport: viewport}).promise;

        let fullText = '';
        for (let i = 0; i < pdf.numPages; i++) {
          const page = await pdf.getPage(i + 1);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          fullText += ' ' + pageText;
        }

        const fraudIndicators = checkFraudIndicators(info, fullText);
        displayResult(fraudIndicators, info);
      } catch (err) {
        errorDiv.textContent = 'Error reading PDF. Make sure it\'s a valid invoice PDF.';
        errorDiv.style.display = 'block';
      }

      loadingDiv.style.display = 'none';
    }

    function checkFraudIndicators(info, fullText) {
      let riskScore = 0;
      const metadataChecks = [];
      const lawChecks = [];

      const creator = (info.Creator || '').toLowerCase();
      const author = (info.Author || '').toLowerCase();
      const title = (info.Title || '').toLowerCase();
      const producer = (info.Producer || '').toLowerCase();
      const keywords = (info.Keywords || '').toLowerCase();

      const suspiciousDesignTools = ['canva', 'adobe', 'indesign', 'google docs'];
      const accountingSoftware = ['sap', 'quickbooks', 'xero', 'sage', 'freshbooks', 'netsuite', 'workbench', 'aspose'];

      if (suspiciousDesignTools.some(tool => creator.includes(tool))) {
        metadataChecks.push({pass: false, text: 'Creator is design software (Canva, Adobe)'});
        riskScore += 50;
      } else if (accountingSoftware.some(soft => creator.includes(soft))) {
        metadataChecks.push({pass: true, text: 'Creator is accounting software'});
        riskScore -= 30;
      } else {
        metadataChecks.push({pass: true, text: 'Creator software looks legitimate'});
      }

      if (keywords && keywords.match(/^[a-z0-9]{10,}$/) && !keywords.includes(' ')) {
        metadataChecks.push({pass: false, text: 'Keywords contain random gibberish'});
        riskScore += 45;
      } else {
        metadataChecks.push({pass: true, text: 'No random keywords'});
      }

      const templateIndicators = ['freelancer invoice', 'minimal invoice', 'invoice template', 'sample invoice', 'black and gray'];
      if (templateIndicators.some(t => title.includes(t))) {
        metadataChecks.push({pass: false, text: 'Title matches generic template'});
        riskScore += 40;
      } else {
        metadataChecks.push({pass: true, text: 'Not a generic template title'});
      }

      if (suspiciousDesignTools.some(tool => producer.includes(tool))) {
        metadataChecks.push({pass: false, text: 'Producer is design software'});
        riskScore += 35;
      } else {
        metadataChecks.push({pass: true, text: 'Producer looks legitimate'});
      }

      const hasVatNumber = /GB\d{9,12}/.test(fullText);
      metadataChecks.push({pass: hasVatNumber, text: 'VAT number present'});
      if (!hasVatNumber) riskScore += 20;

      const hasInvoiceNumber = /invoice.*\d{5,}|no\s*\d{5,}|#\d{5,}/i.test(fullText);
      lawChecks.push({pass: hasInvoiceNumber, text: 'Invoice number found'});
      if (!hasInvoiceNumber) riskScore += 25;

      const hasDate = /\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}/.test(fullText);
      lawChecks.push({pass: hasDate, text: 'Invoice date found'});
      if (!hasDate) riskScore += 20;

      const hasAddress = /address|street|road|house|park|building|suite|floor/i.test(fullText);
      lawChecks.push({pass: hasAddress, text: 'Address details found'});
      if (!hasAddress) riskScore += 20;

      const hasVaguDescription = /Professional Services Rendered|Multidisciplinary Consultancy Services|Services Provided/.test(fullText);
      lawChecks.push({pass: !hasVaguDescription, text: 'Proper description (not vague)'});
      if (hasVaguDescription && riskScore >= 30) riskScore += 30;

      if (fullText.length < 500) {
        lawChecks.push({pass: false, text: 'Invoice content appears brief'});
        riskScore += 15;
      } else {
        lawChecks.push({pass: true, text: 'Sufficient invoice content'});
      }

      return {
        metadataChecks,
        lawChecks,
        riskScore: Math.min(Math.max(riskScore, 0), 100),
        info,
        isRedFlag: riskScore >= 60
      };
    }

    function displayResult(result, info) {
      resultDiv.style.display = 'grid';

      const verdict = document.getElementById('verdict');
      const confidence = document.getElementById('confidence');
      const badge = document.getElementById('badge');

      if (result.isRedFlag) {
        verdict.textContent = 'RED - Likely fraud';
        confidence.textContent = `Risk score: ${result.riskScore}%`;
        badge.style.background = 'var(--fill-danger)';
        badge.innerHTML = '<i class="ti ti-alert-triangle" aria-hidden="true"></i>';
      } else {
        verdict.textContent = 'GREEN - Likely legitimate';
        confidence.textContent = `Risk score: ${result.riskScore}%`;
        badge.style.background = 'var(--fill-success)';
        badge.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>';
      }

      const metadataContainer = document.getElementById('metadataChecks');
      metadataContainer.innerHTML = '';
      result.metadataChecks.forEach(check => {
        const item = document.createElement('div');
        item.className = `check-item ${check.pass ? 'pass' : 'fail'}`;
        item.innerHTML = `<span class="check-icon">${check.pass ? '✓' : '✗'}</span><span>${check.text}</span>`;
        metadataContainer.appendChild(item);
      });

      const lawContainer = document.getElementById('lawChecks');
      lawContainer.innerHTML = '';
      result.lawChecks.forEach(check => {
        const item = document.createElement('div');
        item.className = `check-item ${check.pass ? 'pass' : 'fail'}`;
        item.innerHTML = `<span class="check-icon">${check.pass ? '✓' : '✗'}</span><span>${check.text}</span>`;
        lawContainer.appendChild(item);
      });
    }
  </script>
</body>
</html>
